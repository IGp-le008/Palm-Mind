[project]
name = "palm-mind-rag"
version = "0.1.0"
description = "Document ingestion and conversational RAG backend with interview booking"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "qdrant-client>=1.10",
    "openai>=1.40",
    "pypdf>=4.2",
    "httpx>=0.27",
    "tenacity>=8.5",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "aiosqlite>=0.20",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy","sqlalchemy.ext.mypy.plugin"]
files = ["app", "tests"]
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_explicit = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# third-party packages without complete type stubs
module = ["qdrant_client.*", "pypdf.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
